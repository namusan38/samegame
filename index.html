<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="さめがめローグ">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>さめがめローグ</title>
<style>
:root{--bg:#f6f4ef;--fg:#222;--sub:#777;--cell:#e4e0d6;--btn:#222;--btnfg:#fff;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1e;--fg:#f2f2f2;--sub:#999;--cell:#2c2c2e;--btn:#f2f2f2;--btnfg:#1c1c1e;--card:#2c2c2e}}
:root[data-theme="dark"]{--bg:#1c1c1e;--fg:#f2f2f2;--sub:#999;--cell:#2c2c2e;--btn:#f2f2f2;--btnfg:#1c1c1e;--card:#2c2c2e}
*{box-sizing:border-box}
body,button,.c,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
input{font-size:16px!important;-webkit-user-select:text;user-select:text}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column;align-items:center;padding:10px;-webkit-user-select:none;user-select:none}
.wrap{width:min(100%,420px);position:relative}
.top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
.top b{font-size:18px;font-variant-numeric:tabular-nums}
.prog{height:10px;background:var(--cell);border-radius:5px;overflow:hidden;margin:6px 0}
#pf{height:100%;width:0;background:#30a46c;transition:width .2s}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:14px;flex-wrap:wrap}
button{background:var(--btn);color:var(--btnfg);border:0;border-radius:8px;padding:8px 14px;font-size:14px}
button.on{outline:3px solid #f5c518}
button:disabled{opacity:.35}
#board{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:100%;aspect-ratio:10/12;background:var(--cell);padding:2px;border-radius:8px}
.c{border-radius:6px;transition:transform .08s;position:relative;min-width:0;min-height:0;overflow:hidden}
.c.e{visibility:hidden}
.c svg{position:absolute;inset:0;width:100%;height:100%;display:block;padding:10%}
.c i{font-style:normal;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(13px,4.6vw,21px);color:rgba(255,255,255,.7);pointer-events:none}
#mis{font-size:12px;color:var(--sub);margin:2px 0 6px;min-height:16px}
.c.sel{transform:scale(.82);outline:2px solid var(--fg)}
#msg{min-height:22px;margin-top:8px;font-size:13px;color:var(--sub);text-align:center}
#rel{font-size:12px;color:var(--sub);min-height:18px}
#ov{display:none;position:absolute;inset:0;overflow-y:auto;background:rgba(0,0,0,.72);border-radius:8px;padding:14px;flex-direction:column;gap:8px;justify-content:safe center;color:#fff}
#ov h2{margin:0 0 4px;font-size:18px;text-align:center}
#ov p{margin:0 0 4px;font-size:13px;text-align:center;opacity:.85}
.opt{background:var(--card);color:var(--fg);border-radius:10px;padding:10px 12px;text-align:left}
#nm{border-radius:8px;border:0;padding:8px;font-size:14px;width:100%}#rk{font-size:13px;background:rgba(255,255,255,.12);border-radius:8px;padding:6px 10px;max-height:170px;overflow:auto}#rk:empty{display:none}#scr{position:relative;flex:1;min-height:320px;overflow:hidden;-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent)}#scrt{position:absolute;top:0;left:0;right:0;text-align:center;font-size:17px;line-height:1.9;padding:0 6px;will-change:transform}#scrt div{margin-bottom:1.5em}#rk div{padding:2px 0}#rk .me{color:#f5c518;font-weight:bold}#rk small{opacity:.7;display:block;text-align:center;margin-bottom:2px}
.opt b{display:block;font-size:15px}.opt span{font-size:12px;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><span>ステージ <b id="st">1</b></span><span>手数 <b id="mv">0</b></span><span>ベスト <b id="best">1</b></span></div>
<div class="prog"><div id="pf"></div></div>
<div class="top"><span>スコア <b id="sc">0</b> / <b id="tg">0</b></span></div>
<div class="row"><button id="hm">🔨 ハンマー ×<span id="hn">0</span></button><button id="snd">🔊</button><button id="bgm">🎵</button><button id="bt">♪自動</button><span id="dl"></span><span id="rel"></span></div>
<div id="mis"></div>
<div id="board"></div>
<div id="msg"></div>
<div id="ov"></div>
</div>
<script>
window.onerror=(m,s,l)=>{const e=document.createElement("div");e.style.cssText="position:fixed;left:0;right:0;bottom:0;background:#c00;color:#fff;font-size:12px;padding:6px;z-index:99";e.textContent="エラー: "+m+" ("+l+")";document.body.appendChild(e)};
const CN=["赤","青","緑","黄","紫","橙","ピンク","水色"];
const W=10,H=12,COLORS=["#e5484d","#3e8ef7","#30a46c","#f5c518","#9a5bd6","#f08a24","#e85d9e","#22b8cf"];
const UPS=[
{id:"move",n:"手数 +3",d:"毎ステージの手数が3増える"},
{id:"color",n:"色が1つ減る",d:"ブロックの色数-1(最低3色)"},
{id:"mult",n:"得点 +25%",d:"すべての得点が増える(重ねがけで加算)"},
{id:"small",n:"ちびボーナス",d:"2個消しで+4点"},
{id:"big",n:"ドカン",d:"7個以上消しで+15点"},
{id:"hammer",n:"ハンマー +1",d:"毎ステージ1個消しが1回増える"},
{id:"tri",n:"トリオボーナス",d:"3個消しで+6点"},
{id:"save",n:"手数の貯金",d:"クリア時、残り手数1つにつき+8点(合計スコアに加算)"},
{id:"head",n:"ロケットスタート",d:"各ステージを+25点の状態で始める"},
{id:"refund",n:"リターン",d:"8個以上消すと手数が1戻る"},
{id:"hx",n:"ビッグハンマー",d:"ハンマーが十字(5マス)を消す"},
{id:"clean",n:"お掃除",d:"各ステージ開始時、ブロックが最大8個消えている"},
{id:"pipe",n:"パイプ追加",d:"次のステージから、パイプが1個増える(重ねがけ可)"}];
const $=id=>document.getElementById(id);
let AC=null,muted=false;try{muted=localStorage.getItem("sgr_mute")==="1"}catch(e){}
function sfx(k,n){if(muted)return;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();const t=AC.currentTime;
const tone=(f,s,d,type,v)=>{const o=AC.createOscillator(),gn=AC.createGain();o.type=type||"sine";o.frequency.value=f;gn.gain.setValueAtTime(v||.15,t+s);gn.gain.exponentialRampToValueAtTime(.001,t+s+d);o.connect(gn);gn.connect(AC.destination);o.start(t+s);o.stop(t+s+d+.02)};
if(k==="sel")tone(700,0,.05,"square",.06);
else if(k==="no")tone(180,0,.07,"square",.05);
else if(k==="pop"){const b=300+Math.min(n,20)*40;tone(b,0,.08,"triangle",.2);tone(b*1.5,.05,.1,"triangle",.15);if(n>=8)tone(b*2,.1,.12,"sine",.12);if(n>=12)tone(b*2.5,.16,.15,"sine",.1)}
else if(k==="hammer"){tone(120,0,.15,"sawtooth",.2);tone(80,.05,.12,"square",.15)}
else if(k==="pick"){tone(880,0,.08);tone(1175,.07,.1)}
else if(k==="clear")[523,659,784,1047].forEach((f,i)=>tone(f,i*.1,.18,"triangle",.18));
else if(k==="over")[392,330,262,196].forEach((f,i)=>tone(f,i*.18,.25,"sawtooth",.1));
}catch(e){}}
let g,stage,score,total=0,moves,hammers,up,sel,over,hmode,best=1;
const PIPE="<svg viewBox='0 0 24 24'><path d='M14 15H9Q5 15 5 19' fill='none' stroke='#222' stroke-width='4.6' stroke-linecap='round'/><path d='M14 15H9Q5 15 5 19' fill='none' stroke='#fff' stroke-width='2.4' stroke-linecap='round'/><path d='M13 6h8v8a4 4 0 0 1-4 4h0a4 4 0 0 1-4-4z' fill='#fff' stroke='#222' stroke-width='1.4'/><path d='M16 4q-1.6-1.6 0-3M19 4q-1.6-1.6 0-3' fill='none' stroke='#fff' stroke-width='1.2' stroke-linecap='round'/></svg>";
const SYM=["●","◆","▲","■","★","♥","✚","⬟"];
const D={easy:{n:"簡単",tm:.7,mv:4,b:4,st:99,mx:4,hm:1,pp:1},normal:{n:"普通",tm:1,mv:0,b:5,st:99,mx:5,hm:0,pp:1},hard:{n:"難しい",tm:1.4,mv:-3,b:7,st:99,mx:7,hm:-1,pp:1},extreme:{n:"激ムズ",tm:1.8,mv:-5,b:8,st:99,mx:8,hm:-1,pp:0}};
let diff="normal";try{const d=localStorage.getItem("sgr_diff");if(d&&D[d])diff=d}catch(e){}
const bk=()=>diff==="normal"?"sgr_best":"sgr_best_"+diff;
function loadBest(){best=1;try{best=+localStorage.getItem(bk())||1}catch(e){}}
loadBest();
const target=()=>Math.round((40+25*stage+6*stage*stage)*D[diff].tm);
const ncol=()=>Math.max(3,Math.min(D[diff].mx,D[diff].b+Math.floor((stage-1)/D[diff].st)-up.color));
function run(){const o=$("ov");o.innerHTML="<h2>難易度を選択</h2><p>簡単：目標70%・手数+4・ハンマー+1<br>色は4種類・パイプあり<br><br>普通：標準<br>色は5種類・パイプあり(パイプだけではクリア不可)<br><br>難しい：目標140%・手数-3・ハンマー-1<br>色は7種類・パイプあり<br><br>激ムズ：目標180%・手数-5・ハンマー-1<br>色は8種類・パイプなし</p>";
Object.keys(D).forEach(k=>{const b=document.createElement("button");b.className="opt";b.innerHTML="<b>"+D[k].n+"</b>";b.onclick=()=>{diff=k;try{localStorage.setItem("sgr_diff",k)}catch(e){}loadBest();go()};o.appendChild(b)});o.style.display="flex"}
function go(){stage=1;total=0;endless=false;up={move:0,color:0,mult:0,small:0,big:0,hammer:0,tri:0,save:0,head:0,refund:0,hx:0,clean:0,pipe:0};$("ov").style.display="none";start()}
function tintBg(){const a=Math.min(.04+stage*.012,.22),h=(stage*37)%360;document.body.style.background="radial-gradient(circle at 50% 30%,hsla("+h+",70%,60%,"+a+"),transparent 75%),var(--bg)"}
function start(){const n=ncol(),pc=Math.floor(Math.random()*n);g=[];for(let y=0;y<H;y++){g.push([]);for(let x=0;x<W;x++)g[y].push(Math.floor(Math.random()*n))}
score=25*up.head;moves=15+D[diff].mv+3*up.move;hammers=Math.max(0,1+D[diff].hm+up.hammer);for(let k=0;k<8*up.clean;k++){g[Math.floor(Math.random()*H)][Math.floor(Math.random()*W)]=-1}fall();for(let k=0,np=D[diff].pp+up.pipe,tr=0;k<np&&tr<400;tr++){const px=Math.floor(Math.random()*W),py=Math.floor(Math.random()*H);if(g[py][px]>=0&&g[py][px]<10){g[py][px]+=10;k++}}if(stage>=2)for(let tr=0;tr<300;tr++){const px=Math.floor(Math.random()*W),py=Math.floor(Math.random()*H);if(g[py][px]>=0&&g[py][px]<10){g[py][px]=20;break}}
mis={n:4+Math.floor(Math.random()*4),k:2+Math.floor(Math.random()*2),c:0,done:false};
sel=[];over=false;hmode=false;const pcs=[...new Set(g.flat().filter(v=>v>=10&&v<20).map(v=>CN[v%10]))];$("msg").textContent=pcs.length?"今回のパイプは"+pcs.join("・")+"（同じ色を全部消せる）":"今回のパイプはなし";tintBg();introFx=true;draw()}
function group(x,y){const c=g[y][x];if(c<0)return[];const seen=new Set([y*W+x]),st=[[x,y]],out=[];
while(st.length){const[a,b]=st.pop();out.push([a,b]);[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const nx=a+dx,ny=b+dy;if(nx<0||ny<0||nx>=W||ny>=H)return;const k=ny*W+nx;if(!seen.has(k)&&g[ny][nx]===c){seen.add(k);st.push([nx,ny])}})}
return out}
function pts(n){let p=(n-2)**2;if(n===2)p+=4*up.small;if(n===3)p+=6*up.tri;if(n>=7)p+=15*up.big;return Math.round(p*(1+.25*up.mult))}
function draw(){const bd=$("board");bd.innerHTML="";const ss=new Set(sel.map(([x,y])=>y*W+x));
for(let y=0;y<H;y++)for(let x=0;x<W;x++){const d=document.createElement("div");const v=g[y][x];d.className="c"+(v<0?" e":"")+(ss.has(y*W+x)?" sel":"");if(v>=0){d.style.background=v>=20?"#3a3a3c":COLORS[v%10];if(v>=20)d.innerHTML="<i>💣</i>";else if(v>=10)d.innerHTML=PIPE;else d.innerHTML="<i>"+SYM[v]+"</i>";if(dropFx)d.animate([{transform:"translateY(-7px)"},{transform:"translateY(0)"}],{duration:150});if(introFx)d.animate([{transform:"translateY(-40px)",opacity:0},{transform:"translateY(0)",opacity:1}],{duration:280,delay:y*35+x*6,fill:"backwards"})}d.onclick=()=>tap(x,y);bd.appendChild(d)}
dropFx=false;introFx=false;$("st").textContent=stage;$("mv").textContent=moves;$("best").textContent=best;$("dl").textContent="["+D[diff].n+"] ";{const sc=$("sc");if(sc.textContent!==String(score)){sc.style.display="inline-block";sc.animate([{transform:"scale(1.45)"},{transform:"scale(1)"}],{duration:260})}sc.textContent=score}$("tg").textContent=target();
$("pf").style.width=Math.min(100,score/target()*100)+"%";$("hn").textContent=hammers;
$("hm").disabled=hammers<=0||over;$("hm").className=hmode?"on":"";
const names={move:"手数",color:"色",mult:"得点",small:"ちび",big:"ドカン",hammer:"ハンマー",tri:"トリオ",save:"貯金",head:"ロケット",refund:"リターン",hx:"ビッグ🔨",clean:"お掃除",pipe:"パイプ"};
$("rel").textContent=Object.keys(up).filter(k=>up[k]).map(k=>names[k]+"×"+up[k]).join(" ");
$("mis").textContent=mis.done?"✅ ミッション達成！":"🎯 "+mis.n+"個以上の塊を"+mis.k+"回消す ("+mis.c+"/"+mis.k+") 達成で手数+2"}
function fall(){for(let x=0;x<W;x++){const col=[];for(let y=H-1;y>=0;y--)if(g[y][x]>=0)col.push(g[y][x]);for(let y=H-1,i=0;y>=0;y--,i++)g[y][x]=i<col.length?col[i]:-1}
let t=0;for(let x=0;x<W;x++){if(g[H-1][x]>=0){if(t!==x)for(let y=0;y<H;y++){g[y][t]=g[y][x];g[y][x]=-1}t++}}}
const hasMove=()=>{for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(g[y][x]>=10||(g[y][x]>=0&&group(x,y).length>=2))return true;return false};
function tap(x,y){bgmOn();if(over||busy||g[y][x]<0)return;
if(hmode){if(hammers<=0)return;(up.hx?[[0,0],[1,0],[-1,0],[0,1],[0,-1]]:[[0,0]]).forEach(([a,b])=>{const X=x+a,Y=y+b;if(X>=0&&Y>=0&&X<W&&Y<H)g[Y][X]=-1});hammers--;hmode=false;sel=[];sfx("hammer");fall();check();return}
if(g[y][x]>=20){const bc=[];for(let b=-1;b<=1;b++)for(let a=-1;a<=1;a++){const X=x+a,Y=y+b;if(X>=0&&Y>=0&&X<W&&Y<H&&g[Y][X]>=0)bc.push([X,Y])}
const bp=Math.round(bc.length*4*(1+.25*up.mult));
if(selPipe==="bomb"&&sel.some(([a,b])=>a===x&&b===y)){burst(bc.map(([a,b])=>[a,b,g[b][a]]),9);bc.forEach(([a,b])=>g[b][a]=-1);score+=bp;moves--;sel=[];selPipe=false;dropFx=true;sfx("pop",14);fall();$("msg").textContent="ボム！ "+bc.length+"個消し +"+bp+"点";check()}
else{sel=bc;selPipe="bomb";sfx("sel");draw();$("msg").textContent="ボム：周囲"+bc.length+"個を消す(+"+bp+"点)"}return}
if(g[y][x]>=10){const c=g[y][x]%10,all=[];for(let j=0;j<H;j++)for(let i=0;i<W;i++)if(g[j][i]>=0&&g[j][i]<20&&g[j][i]%10===c)all.push([i,j]);
const pp=Math.min(Math.round(all.length*3*(1+.25*up.mult)),Math.floor(target()*(diff==="normal"?.5:9)));
if(selPipe==="pipe"&&sel.some(([a,b])=>a===x&&b===y)){burst(all.map(([a,b])=>[a,b,g[b][a]]),all.length);dropFx=true;all.forEach(([a,b])=>g[b][a]=-1);score+=pp;moves--;sel=[];selPipe=false;sfx("pop",12);fall();$("msg").textContent="パイプ！ "+all.length+"個消し +"+pp+"点";check()}
else{sel=all;selPipe="pipe";sfx("sel");draw();$("msg").textContent="パイプ：同じ色"+all.length+"個を消す(+"+pp+"点)"}return}
const gr=group(x,y);if(gr.length<2){sel=[];sfx("no");draw();return}
if(!selPipe&&sel.some(([a,b])=>a===x&&b===y)){busy=true;shrink(gr);setTimeout(()=>{busy=false;burst(gr.map(([a,b])=>[a,b,g[b][a]]),gr.length);dropFx=true;gr.forEach(([a,b])=>g[b][a]=-1);const p=pts(gr.length);if(!mis.done&&gr.length>=mis.n&&++mis.c>=mis.k){mis.done=true;moves+=2}score+=p;moves--;if(gr.length>=8)moves+=up.refund;sel=[];sfx("pop",gr.length);fall();if(gr.length>=6)praise(gr.length);$("msg").textContent=gr.length+"個消し +"+p+"点";check()},160)}
else{sel=gr;selPipe=false;sfx("sel");draw();$("msg").textContent=gr.length+"個選択中(+"+pts(gr.length)+"点)"}}
function check(){draw();
const ac=g.flat().every(v=>v<0);if(ac)score+=100;if(score>=target()||ac){const lf=g.flat().filter(v=>v>=0).length;if(!ac&&lf<=10)score+=(11-lf)*10;over=true;total+=score+moves*8*up.save;if(stage>=best){best=stage+1;try{localStorage.setItem(bk(),best)}catch(e){}}draw();sfx("clear");sparkle();return(stage===20&&!endless)?ending():pick()}
if(moves<=0||(!hasMove()&&hammers<=0)){over=true;draw();return fail(moves<=0?"手数切れ":"消せる塊がなくなった")}}
let bgmWanted=true,bgmTimer=null,bgmStep=0,bgmNext=0,bgmGain=null,nb=null;
try{bgmWanted=localStorage.getItem("sgr_bgm")!=="0"}catch(e){}
const CH=[[110,[0,3,7]],[87.31,[0,4,7]],[130.81,[0,4,7]],[98,[0,4,7]]];
function bo(type,f,t,d,v,fc){const o=AC.createOscillator(),gn=AC.createGain();o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);let n=o;if(fc){const fl=AC.createBiquadFilter();fl.type="lowpass";fl.frequency.value=fc;o.connect(fl);n=fl}n.connect(gn);gn.connect(bgmGain);o.start(t);o.stop(t+d+.02)}
function bn(t,d,v,fc){const s=AC.createBufferSource(),gn=AC.createGain(),fl=AC.createBiquadFilter();s.buffer=nb;fl.type="highpass";fl.frequency.value=fc;gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl);fl.connect(gn);gn.connect(bgmGain);s.start(t);s.stop(t+d)}
function bstep(i,t){const s=i%16,[r,ch]=CH[Math.floor(i/16)%4];
if(s%4===0){const o=AC.createOscillator(),gn=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);gn.gain.setValueAtTime(.5,t);gn.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(gn);gn.connect(bgmGain);o.start(t);o.stop(t+.17)}
if(s===4||s===12)bn(t,.1,.18,1500);
if(s%2===1)bn(t,.03,.06,7000);
if([0,3,6,8,11,14].includes(s))bo("sawtooth",r,t,.2,.14,420);
bo("square",r*2*(s%8>=4?2:1)*Math.pow(2,ch[[0,1,2,1][s%4]]/12),t,.11,.035,2200);
if(stage>=4&&s%8===0)bo("triangle",r*4*Math.pow(2,ch[2]/12),t,.5,.07)}
let bgmMode=4,bgmCur=0;try{const m=localStorage.getItem("sgr_bm");if(m!==null&&+m>=0&&+m<=4)bgmMode=+m}catch(e){}
function kick(t,v){const o=AC.createOscillator(),gn=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(gn);gn.connect(bgmGain);o.start(t);o.stop(t+.17)}
const mf=(r,x)=>r*Math.pow(2,x/12);
function chip(i,t){const s=i%16,[r,ch]=[[130.81,[0,4,7]],[98,[0,4,7]],[110,[0,3,7]],[87.31,[0,4,7]]][Math.floor(i/16)%4];
if(s%2===0)bo("square",r,t,.1,.09,500);
bo("square",mf(r*2,ch[s%3]+(s%8>=4?12:0)),t,.07,.03,3000);
const li=[2,-1,1,-1,2,-1,0,-1,1,-1,2,-1,1,-1,0,-1][s];if(li>=0)bo("square",mf(r*4,ch[li]),t,.14,.05,4000);
if(s%4===0)kick(t,.4);if(s===4||s===12)bn(t,.1,.14,2500);if(s%2===1)bn(t,.03,.05,9000)}
function lofi(i,t){const s=i%16,[r,ch]=[[174.6,[0,4,7,11]],[164.8,[0,3,7,10]],[146.8,[0,3,7,10]],[130.8,[0,4,7,11]]][Math.floor(i/16)%4];
if(s===0)ch.forEach(x=>bo("triangle",mf(r*2,x),t,3,.045,1200));
if(s===0||s===10){bo("sine",r/2,t,.7,.2);kick(t,.3)}
if(s===8)bn(t,.12,.07,1200);if(s%2===0)bn(t,.025,.025,8000);
if([2,6,11,14].includes(s))bo("triangle",mf(r*4,ch[(i*5+(i>>4))%4]),t,.35,.06,2500)}
function cyber(i,t){const s=i%16,[r,ch]=[[82.41,[0,3,7]],[65.41,[0,4,7]],[98,[0,4,7]],[73.42,[0,4,7]]][Math.floor(i/16)%4];
if(s%2===0)bo("sawtooth",r*(s%8===6?2:1),t,.13,.13,650);
if(s%4===0)kick(t,.5);if(s===4||s===12)bn(t,.1,.2,1800);bn(t,.02,.035,9000);
if([0,3,6,10,12].includes(s))ch.forEach(x=>bo("sawtooth",mf(r*4,x),t,.1,.025,2600));
if(s%2===1)bo("triangle",mf(r*8,ch[(s>>1)%3]),t,.08,.03)}
let titleMode=false;
const MEL=[{0:7,4:10,8:7,12:5},{0:7,4:4,8:7,12:12},{0:7,4:10,8:12,12:10},{0:7,4:4,8:7,12:0}];
function titleBgm(i,t){const s=i%16,bar=Math.floor(i/16)%4,[r,ch]=[[146.83,[0,3,7]],[116.54,[0,4,7]],[98,[0,3,7]],[110,[0,4,7]]][bar];
if(s===0)ch.forEach(x=>bo("triangle",mf(r*2,x),t,2.8,.04,1500));
if(s===0||s===8){bo("sine",r,t,1.2,.18);kick(t,.15)}
if(s%2===0){const a=[0,1,2,1,2,1,0,1][(s>>1)%8];bo("sine",mf(r*2,ch[a]),t,.5,.05);bo("sine",mf(r*4,ch[a]),t,.25,.015)}
const mn=MEL[bar][s];if(mn!==undefined)bo("triangle",mf(r*4,mn),t,.9,.07,2800)}
const TR=[{n:"ダーク",f:bstep,b:()=>116+Math.min(stage,10)*3},{n:"チップ",f:chip,b:()=>138+Math.min(stage,10)*2},{n:"ローファイ",f:lofi,b:()=>78},{n:"サイバー",f:cyber,b:()=>148},{n:"タイトル",f:titleBgm,b:()=>84}];
const curTr=()=>titleMode?4:bgmMode<4?bgmMode:[2,1,0,3][Math.min(3,Math.max(0,Math.floor(((stage||1)-1)/3)))];
const curBpm=()=>(TR[bgmCur]||TR[0]).b();
function bstep2(i,t){if(i%16===0)bgmCur=curTr();(TR[bgmCur]||TR[0]).f(i,t)}
function bsched(){if(!AC)return;if(bgmNext<AC.currentTime-.5)bgmNext=AC.currentTime+.05;while(bgmNext<AC.currentTime+.2){bstep2(bgmStep,bgmNext);bgmNext+=60/curBpm()/4;bgmStep++}}
function bgmOn(){if(!bgmWanted||bgmTimer)return;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
nb=AC.createBuffer(1,Math.floor(AC.sampleRate*.2),AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
bgmGain=AC.createGain();bgmGain.gain.value=.5;bgmGain.connect(AC.destination);bgmNext=AC.currentTime+.1;bgmStep=0;bgmCur=curTr();bgmTimer=setInterval(bsched,50)}catch(e){}}
function bgmOff(){clearInterval(bgmTimer);bgmTimer=null;if(bgmGain){try{bgmGain.disconnect()}catch(e){}bgmGain=null}}
let DB=null,UID=null;
(async()=>{try{if(!window.claude)return;DB=await claude.use("db");const u=await claude.use("user");UID=u?await u.id():null}catch(e){}})();
const myName=()=>{try{return localStorage.getItem("sgr_name")||""}catch(e){return""}};
async function rank(pts,st){
const nm=($("nm").value||"").trim().slice(0,10)||"名無し";
try{localStorage.setItem("sgr_name",nm)}catch(e){}
let L=[];try{L=JSON.parse(localStorage.getItem("sgr_rank")||"[]")}catch(e){}
const t=Date.now();L.push({n:nm,p:pts,s:st,t,d:diff});L.sort((a,b)=>b.p-a.p);L=L.slice(0,30);
try{localStorage.setItem("sgr_rank",JSON.stringify(L))}catch(e){}
let rows=L.filter(x=>(x.d||"normal")===diff).map(x=>({n:x.n,p:x.p,s:x.s,me:x.t===t})),title="あなたの記録 TOP5",note="";
if(DB&&UID){try{
const ref=DB.doc("scores/"+UID),cur=await ref.get(),old=cur.exists?cur.data():null;
const K={easy:"e",normal:"",hard:"h",extreme:"x"}[diff],fp="p"+K,fs="s"+K,op=old&&typeof old[fp]==="number"?old[fp]:-1;
if(!old||op<pts||old.n!==nm)await ref.set({...(old||{}),n:nm,u:UID,t,[fp]:Math.max(op,pts),[fs]:op>=pts?old[fs]:st});
const q=await DB.collection("scores").orderBy(fp,"desc").limit(50).get();
rows=q.docs.map(d=>d.data()).filter(v=>typeof v[fp]==="number").map(v=>({n:String(v.n||""),p:v[fp],s:v[fs],me:v.u===UID}));
title="みんなのランキング"}catch(e){note="共有ランキングに登録できませんでした(閲覧のみの権限だと書き込めません)"}}
else note="共有ランキングは使えないため、この端末の記録を表示しています";
const rk=$("rk");rk.innerHTML="";
const h=document.createElement("small");h.textContent=title+" ["+D[diff].n+"]";rk.appendChild(h);
const mi=rows.findIndex(r=>r.me);
rows.forEach((r,i)=>{if(i>=5&&i!==mi)return;const d=document.createElement("div");if(r.me)d.className="me";d.textContent=(i+1)+"位 "+r.n+" — "+r.p+"点 (ステージ"+r.s+")";rk.appendChild(d)});
if(note){const s=document.createElement("small");s.textContent=note;rk.appendChild(s)}}
function burst(cs,n){const bd=$("board"),wr=bd.parentElement,wb=wr.getBoundingClientRect();
for(let i=0;i<Math.min(cs.length,28);i++){const[x,y,c]=cs[i],el=bd.children[y*W+x];if(!el)continue;const r=el.getBoundingClientRect();
for(let k=0;k<(n>=6?3:2);k++){const p=document.createElement("div");p.style.cssText="position:absolute;pointer-events:none;border-radius:50%;width:7px;height:7px;z-index:5;background:"+(c>=20?"#999":COLORS[c%10])+";left:"+(r.left-wb.left+r.width/2)+"px;top:"+(r.top-wb.top+r.height/2)+"px";wr.appendChild(p);
const a=Math.random()*6.28,d=18+Math.random()*(26+n*4);
p.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:"translate("+Math.cos(a)*d+"px,"+Math.sin(a)*d+"px) scale(.2)",opacity:0}],{duration:420+Math.random()*200,easing:"ease-out"}).onfinish=()=>p.remove()}}
if(n>=6){const m=Math.min(2+n/2,10);bd.animate([{transform:"translate(0,0)"},{transform:"translate("+m+"px,"+(-m/2)+"px)"},{transform:"translate("+(-m)+"px,"+m/2+"px)"},{transform:"translate("+m/2+"px,0)"},{transform:"translate(0,0)"}],{duration:220})}}
function sparkle(){const w=$("board").parentElement;for(let i=0;i<24;i++){const p=document.createElement("div");p.textContent="✦";p.style.cssText="position:absolute;pointer-events:none;z-index:7;left:50%;top:45%;font-size:"+(10+Math.random()*12)+"px;color:"+["#f5c518","#fff","#ffd9f0","#9ef0ff"][i%4];w.appendChild(p);const a=Math.random()*6.28,d=60+Math.random()*90;p.animate([{transform:"translate(-50%,-50%) scale(.3)",opacity:1},{transform:"translate(calc(-50% + "+Math.cos(a)*d+"px),calc(-50% + "+Math.sin(a)*d+"px)) scale(1)",opacity:0}],{duration:800+Math.random()*400,easing:"ease-out"}).onfinish=()=>p.remove()}}
let busy=false,introFx=false;
function shrink(cs){const bd=$("board");cs.forEach(([x,y])=>{const el=bd.children[y*W+x];if(el)el.animate([{transform:"scale(1)",opacity:1},{transform:"scale(.2)",opacity:0}],{duration:150,fill:"forwards"})})}
function praise(n){const w=n>=10?"すごい！":n>=8?"ナイス！":"いいね！";const d=document.createElement("div");d.textContent=w;d.style.cssText="position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-size:32px;font-weight:bold;color:#f5c518;text-shadow:0 2px 6px #000;pointer-events:none;z-index:6;white-space:nowrap";$("board").parentElement.appendChild(d);d.animate([{opacity:0,transform:"translate(-50%,-30%) scale(.6)"},{opacity:1,transform:"translate(-50%,-50%) scale(1.1)"},{opacity:0,transform:"translate(-50%,-80%) scale(1)"}],{duration:900}).onfinish=()=>d.remove()}
function pick(){const o=$("ov");const ch=[...UPS].sort(()=>Math.random()-.5).slice(0,3);let pk=false;
o.innerHTML="<h2>"+(g.flat().every(v=>v<0)?"全消し！+100点 ":"")+"ステージ"+stage+" クリア！</h2><p>強化を1つ選んでください</p>";
ch.forEach(u=>{const b=document.createElement("button");b.className="opt";b.innerHTML="<b>"+u.n+"</b><span>"+u.d+"</span>";b.onclick=()=>{if(pk)return;pk=true;sfx("pick");up[u.id]++;b.animate([{transform:"scale(1)",boxShadow:"0 0 0 0 #f5c518"},{transform:"scale(1.06)",boxShadow:"0 0 24px 6px #f5c518"}],{duration:300,fill:"forwards"});setTimeout(()=>{stage++;o.style.display="none";start()},320)};o.appendChild(b)});
o.style.display="flex"}
function fail(why){sfx("over");const o=$("ov");const fin=total+score;o.innerHTML="<h2>ゲームオーバー</h2><p>"+why+"<br>["+D[diff].n+"] 到達ステージ "+stage+" ／ 合計スコア <b>"+fin+"</b></p><input id=\"nm\" maxlength=\"10\" placeholder=\"ニックネーム\"><div id=\"rk\"></div>";$("nm").value=myName();const r=document.createElement("button");r.className="opt";r.innerHTML="<b>ランキングに登録</b>";r.onclick=()=>{r.style.display="none";rank(fin,stage)};o.appendChild(r);
const b=document.createElement("button");b.className="opt";b.innerHTML="<b>もう一度挑戦</b>";b.onclick=run;o.appendChild(b);o.style.display="flex"}
$("hm").onclick=()=>{if(over||hammers<=0)return;hmode=!hmode;sel=[];$("msg").textContent=hmode?"消したいブロックを1つタップ":"";draw()};
$("snd").textContent=muted?"🔇":"🔊";
$("snd").onclick=()=>{muted=!muted;try{localStorage.setItem("sgr_mute",muted?"1":"0")}catch(e){}$("snd").textContent=muted?"🔇":"🔊";if(!muted)sfx("sel")};
$("bgm").style.opacity=bgmWanted?1:.4;
$("bgm").onclick=()=>{bgmWanted=!bgmWanted;try{localStorage.setItem("sgr_bgm",bgmWanted?"1":"0")}catch(e){}$("bgm").style.opacity=bgmWanted?1:.4;if(bgmWanted)bgmOn();else bgmOff()};
const bl=()=>$("bt").textContent="♪"+(bgmMode<4?TR[bgmMode].n:"自動");
bl();$("bt").onclick=()=>{bgmMode=(bgmMode+1)%5;try{localStorage.setItem("sgr_bm",bgmMode);localStorage.setItem("sgr_bgm","1")}catch(e){}bl();bgmWanted=true;$("bgm").style.opacity=1;bgmOff();bgmOn()};
let endless=false,selPipe=false,dropFx=false,mis={n:4,k:2,c:0,done:true};
function ending(){const o=$("ov"),fin=total;
o.innerHTML="<h2 style='font-size:22px'>🎉 エンディング 🎉</h2><p style='line-height:1.7'>20ステージを駆け抜けたあなたの前で、最後のブロックが光になって消えた。<br>色の迷宮は静まり返り、出口の扉がゆっくりと開く……<br><b>完全クリア！おめでとう！</b></p><p>["+D[diff].n+"] 合計スコア <b>"+fin+"</b></p><input id='nm' maxlength='10' placeholder='ニックネーム'><div id='rk'></div>";
$("nm").value=myName();
const mk=(t,f)=>{const b=document.createElement("button");b.className="opt";b.style.textAlign="center";b.innerHTML="<b>"+t+"</b>";b.onclick=f;o.appendChild(b);return b};

function intro(){const o=$("ov");
const L=["虚無は星を破壊するのではない。","星の存在そのものを、世界の記憶から消してしまう。","街は消え、人々は家族を忘れ、歴史は失われていった。","そして最後に残ったのが、宇宙の片隅に浮かぶ小さな箱庭だった。","箱庭には、色とりどりの結晶が積み重なっている。"];
const cs=["赤","青","緑","黄色","紫"].map((w,i)=>"<span style='color:"+COLORS[i]+"'>"+w+"</span>").join("、")+"。";
o.innerHTML="<div id='scr'><div id='scrt'>"+L.map(t=>"<div>"+t+"</div>").join("")+"<div>"+cs+"</div></div></div>";
const sk=document.createElement("button");sk.className="opt";sk.style.textAlign="center";sk.innerHTML="<b>スキップ</b>";o.appendChild(sk);
o.style.display="flex";
const sc=$("scr"),tx=$("scrt");let an=null,done=false;

const H=sc.offsetHeight,h=tx.offsetHeight;
an=tx.animate([{transform:"translateY("+H+"px)"},{transform:"translateY("+(-h)+"px)"}],{duration:(H+h)/42*1000,easing:"linear",fill:"forwards"});
an.onfinish=end}
function title(){const o=$("ov");o.innerHTML="<h2 style=\"font-size:26px\">さめがめローグ</h2><p>同じ色のブロックを消して、目標スコアを目指そう</p><p style=\"text-align:left;line-height:1.7\"><b>【遊び方】</b><br>① 同じ色が2個以上つながった塊をタップで選択<br>② もう一度タップで消去(大きい塊ほど高得点)<br>③ 手数内に目標スコア、または全消しでステージクリア<br>④ クリアごとに強化を1つ選べる<br>🔨 ハンマーは手数を使わず1個だけ消せる<br>【パイプ】絵柄付きのブロックをタップすると、同じ色を全部消せる(激ムズは強化で入手)<br>💣 ボムはタップで周囲3×3を消す(2面から出現)<br>🎯 ミッション達成で手数+2<br>♪ ボタンで音のオン/オフとBGMの切り替え</p><p style='font-size:12px'>♪ 画面を1回タップすると音楽が流れます</p>";
const b=document.createElement("button");b.className="opt";b.style.textAlign="center";b.innerHTML="<b>スタート</b>";b.onclick=()=>{titleMode=false;bgmOff();bgmOn();intro()};o.appendChild(b);o.style.display="flex";titleMode=true;["click","touchend","keydown"].forEach(ev=>document.addEventListener(ev,()=>{if(titleMode){bgmOn();if(AC&&AC.state==="suspended")AC.resume()}}))}
title();
